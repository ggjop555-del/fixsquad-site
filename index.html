<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixSquad Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --primary-orange: #ff9500;
            --text-color: #ffffff;
            --text-muted: #777777;
            --border-color: #222222;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            padding-bottom: 110px;
            overflow-x: hidden;
        }

        /* Анимация фона */
        .background-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .floating-icon {
            position: absolute; bottom: -50px; opacity: 0.08;
            animation: floatUp 10s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.12; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container { position: relative; z-index: 2; max-width: 500px; margin: 0 auto; }

        /* Переключатель языков */
        .lang-picker {
            display: flex; justify-content: center; gap: 12px; margin-bottom: 15px;
            background: var(--card-bg); padding: 8px; border-radius: 30px; border: 1px solid var(--border-color);
        }
        .lang-btn {
            font-size: 1.4em; cursor: pointer; filter: grayscale(60%); transition: transform 0.2s, filter 0.2s;
        }
        .lang-btn.active { filter: grayscale(0%); transform: scale(1.2); }

        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary-orange); margin: 0; font-size: 1.7em; letter-spacing: 2px; text-transform: uppercase; }
        .subtitle { color: var(--text-muted); font-size: 0.8em; text-transform: uppercase; margin-top: 5px; }

        .category-title {
            font-size: 0.8em; color: var(--primary-orange); margin: 20px 0 10px 5px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center;
        }
        .category-title::after { content: ""; flex: 1; height: 1px; background: var(--border-color); margin-left: 10px; }

        .service-list { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .service-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer;
        }
        .service-item:last-child { border-bottom: none; }
        .service-info { display: flex; flex-direction: column; }
        .service-name { font-size: 0.95em; font-weight: 500; }
        .service-price { color: var(--text-muted); font-size: 0.8em; margin-top: 2px; }
        
        .service-item.selected { background: rgba(255, 149, 0, 0.08); }
        .service-item.selected .service-name { color: var(--primary-orange); }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary-orange); pointer-events: none; }

        .bottom-panel {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color); padding: 15px; box-sizing: border-box; z-index: 10;
        }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px; }
        .total-label { font-size: 0.9em; color: var(--text-muted); }
        .total-amount { color: var(--primary-orange); font-weight: bold; font-size: 1.2em; }
        .btn-order {
            width: 100%; background: var(--primary-orange); color: #000; border: none; padding: 14px;
            border-radius: 10px; font-weight: bold; font-size: 1em; text-transform: uppercase; cursor: pointer;
        }
        .btn-order:disabled { background: #222; color: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="background-animation" id="bg-animation"></div>

    <div class="container">
        <div class="lang-picker">
            <span class="lang-btn" onclick="setLanguage('en')" id="btn-en">🇬🇧</span>
            <span class="lang-btn" onclick="setLanguage('ru')" id="btn-ru">🇷🇺</span>
            <span class="lang-btn" onclick="setLanguage('uk')" id="btn-uk">🇺🇦</span>
            <span class="lang-btn" onclick="setLanguage('nl')" id="btn-nl">🇳🇱</span>
        </div>

        <header>
            <h1>FIXSQUAD PRO</h1>
            <div class="subtitle" id="sub-title">Premium Repair Service • Eindhoven</div>
        </header>

        <div id="content-area"></div>
    </div>

    <div class="bottom-panel">
        <div class="total-row">
            <span class="total-label" id="total-label">Total Estimate:</span>
            <span class="total-amount" id="total-display">€0</span>
        </div>
        <button class="btn-order" id="order-btn" disabled onclick="sendOrder()">Place Order</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#000000');

        let currentLang = 'en';
        let total = 0;
        let selectedServices = [];

        // База данных переводов
        const translations = {
            en: {
                sub: "Premium Repair Service • Eindhoven", totalLabel: "Total Estimate:", button: "Place Order", free: "Free", from: "from",
                cats: { smart: "Smartphones", lap: "Laptops & MacBooks", console: "Gaming Consoles" },
                items: {
                    diag: "Full Diagnostics", screen_i: "iPhone Screen Replacement", batt: "Battery Replacement",
                    clean_l: "Dust Cleaning + Thermal Paste", screen_m: "MacBook Screen Repair", keyb: "Keyboard Replacement",
                    clean_c: "PS5 / Xbox Cleaning", hdmi: "HDMI Port Replacement", drift: "DualSense Drift Repair"
                }
            },
            ru: {
                sub: "Премиум Ремонт Техники • Эйндховен", totalLabel: "Предварительный итог:", button: "Оформить Заказ", free: "Бесплатно", from: "от",
                cats: { smart: "Смартфоны", lap: "Ноутбуки и Макбуки", console: "Игровые Консоли" },
                items: {
                    diag: "Полная Диагностика", screen_i: "Замена экрана iPhone", batt: "Замена аккумулятора",
                    clean_l: "Чистка от пыли + термопаста", screen_m: "Ремонт экрана MacBook", keyb: "Замена клавиатуры",
                    clean_c: "Чистка PS5 / Xbox", hdmi: "Замена разъема HDMI", drift: "Ремонт дрифта стика DualSense"
                }
            },
            uk: {
                sub: "Преміум Ремонт Техніки • Ейндховен", totalLabel: "Попередній підсумок:", button: "Оформити Замовлення", free: "Безкоштовно", from: "від",
                cats: { smart: "Смартфони", lap: "Ноутбуки та Макбуки", console: "Ігрові Консолі" },
                items: {
                    diag: "Повна Діагностика", screen_i: "Заміна екрану iPhone", batt: "Заміна акумулятора",
                    clean_l: "Чистка від пилу + термопаста", screen_m: "Ремонт екрану MacBook", keyb: "Заміна клавіатури",
                    clean_c: "Чистка PS5 / Xbox", hdmi: "Заміна роз'єму HDMI", drift: "Ремонт дрифту стіка DualSense"
                }
            },
            nl: {
                sub: "Premium Reparatieservice • Eindhoven", totalLabel: "Geschatte Totaal:", button: "Bestellen", free: "Gratis", from: "vanaf",
                cats: { smart: "Smartphones", lap: "Laptops & MacBooks", console: "Spelcomputers" },
                items: {
                    diag: "Volledige Diagnose", screen_i: "iPhone Scherm Vervangen", batt: "Batterij Vervangen",
                    clean_l: "Stofvrij Maken + Koelpasta", screen_m: "MacBook Scherm Reparatie", keyb: "Toetsenbord Vervangen",
                    clean_c: "PS5 / Xbox Reiniging", hdmi: "HDMI Poort Vervangen", drift: "DualSense Drift Reparatie"
                }
            }
        };

        // Структура цен
        const menuStructure = [
            { cat: 'smart', nameKey: 'diag', price: 0, isFree: true },
            { cat: 'smart', nameKey: 'screen_i', price: 55 },
            { cat: 'smart', nameKey: 'batt', price: 35 },
            { cat: 'lap', nameKey: 'clean_l', price: 40 },
            { cat: 'lap', nameKey: 'screen_m', price: 90 },
            { cat: 'lap', nameKey: 'keyb', price: 50 },
            { cat: 'console', nameKey: 'clean_c', price: 45 },
            { cat: 'console', nameKey: 'hdmi', price: 60 },
            { cat: 'console', nameKey: 'drift', price: 25 }
        ];

        function setLanguage(lang) {
            currentLang = lang;
            
            // Подсветка активного флага
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');

            // Перевод статичных заголовков
            const t = translations[lang];
            document.getElementById('sub-title').innerText = t.sub;
            document.getElementById('total-label').innerText = t.totalLabel;
            document.getElementById('order-btn').innerText = t.button;

            // Отрисовка списка с новым языком без потери галочек
            renderMenu();
        }

        function renderMenu() {
            const area = document.getElementById('content-area');
            area.innerHTML = '';
            const t = translations[currentLang];

            const categories = {
                smart: t.cats.smart,
                lap: t.cats.lap,
                console: t.cats.console
            };

            for (const [catKey, catName] of Object.entries(categories)) {
                const catTitle = document.createElement('div');
                catTitle.className = 'category-title';
                catTitle.innerText = catName;
                area.appendChild(catTitle);

                const listDiv = document.createElement('div');
                listDiv.className = 'service-list';

                const items = menuStructure.filter(i => i.cat === catKey);
                items.forEach(item => {
                    const itemName = t.items[item.nameKey];
                    const priceText = item.isFree ? t.free : `${t.from} €${item.price}`;
                    const isSelected = selectedServices.includes(t.items[item.nameKey]) || selectedServices.some(s => Object.values(translations).some(langObj => langObj.items[item.nameKey] === s));

                    const itemDiv = document.createElement('div');
                    itemDiv.className = `service-item ${isSelected ? 'selected' : ''}`;
                    
                    // Хак для сохранения связи выбранных элементов
                    itemDiv.onclick = (e) => toggleService(itemDiv, item.price, item.nameKey);

                    itemDiv.innerHTML = `
                        <div class="service-info">
                            <span class="service-name">${itemName}</span>
                            <span class="service-price">${priceText}</span>
                        </div>
                        <input type="checkbox" ${isSelected ? 'checked' : ''}>
                    `;
                    listDiv.appendChild(itemDiv);
                });
                area.appendChild(listDiv);
            }
        }

        function toggleService(element, price, nameKey) {
            const checkbox = element.querySelector('input[type="checkbox"]');
            checkbox.checked = !checkbox.checked;

            // Сохраняем имя строго на выбранном текущем языке для чека
            const serviceName = translations[currentLang].items[nameKey];

            if (checkbox.checked) {
                total += price;
                selectedServices.push(serviceName);
                element.classList.add('selected');
            } else {
                total -= price;
                // Удаляем элемент, учитывая возможные переводы
                selectedServices = selectedServices.filter(s => s !== serviceName && !Object.values(translations).some(l => l.items[nameKey] === s));
                element.classList.remove('selected');
            }

            document.getElementById('total-display').innerText = `€${total}`;
            document.getElementById('order-btn').disabled = selectedServices.length === 0;
            tg.HapticFeedback.impactOccurred('light');
        }

        function sendOrder() {
            tg.sendData(JSON.stringify({
                services: selectedServices,
                totalPrice: total,
                lang: currentLang
            }));
            tg.close();
        }

        // Запуск анимации заднего фона
        const bgIcons = ['🍏', '🤖', '🎮', '💻', '⚙️', '△', '◯', '✖', '□'];
        const bgContainer = document.getElementById('bg-animation');
        for (let i = 0; i < 15; i++) {
            const icon = document.createElement('div');
            icon.className = 'floating-icon';
            icon.innerText = bgIcons[Math.floor(Math.random() * bgIcons.length)];
            icon.style.left = Math.random() * 100 + '%';
            icon.style.animationDelay = Math.random() * 8 + 's';
            icon.style.fontSize = Math.random() * 12 + 15 + 'px';
            bgContainer.appendChild(icon);
        }

        // Инициализация английского языка по дефолту
        setLanguage('en');
    </script>
</body>
</html>
