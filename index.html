<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixSquad Service Eindhoven</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #2c2c2e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            color: #0a84ff;
            margin-bottom: 5px;
        }
        .city {
            color: #8e8e93;
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .price-list {
            text-align: left;
            background: #3a3a3c;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .price-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #48484a;
        }
        .price-item:last-child {
            border-bottom: none;
        }
        .price-name { font-weight: 500; }
        .price-value { color: #30d158; font-weight: bold; }
        
        .btn {
            display: block;
            background: #0a84ff;
            color: #white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #007aff;
        }
        .btn-tg {
            background: #248bcf;
        }
        .contacts {
            margin-top: 30px;
            color: #aeaea3;
            font-size: 0.9em;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FixSquad</h1>
        <p class="city">Ремонт техники в Eindhoven</p>

        <div class="price-list">
            <div class="price-item">
                <span class="price-name">🔍 Диагностика</span>
                <span class="price-value">Бесплатно</span>
            </div>
            <div class="price-item">
                <span class="price-name">📱 Замена экрана (iPhone/Samsung)</span>
                <span class="price-value">от €50</span>
            </div>
            <div class="price-item">
                <span class="price-name">🔋 Замена аккумулятора</span>
                <span class="price-value">от €30</span>
            </div>
            <div class="price-item">
                <span class="price-name">💧 Чистка после влаги</span>
                <span class="price-value">от €40</span>
            </div>
        </div>

        <a href="https://t.me/florida294" class="btn btn-tg">💬 Написать в Telegram</a>
        <a href="tel:+31620814177" class="btn">📞 Позвонить мастеру</a>

        <div class="contacts">
            <p>📍 Eindhoven, Netherlands<br>
            📧 vitaliikorin72@gmail.com<br>
            ⏰ Пн-Пт: 09:00 - 18:00</p>
        </div>
    </div>

</body>
</html>
